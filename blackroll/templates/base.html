<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}blackRoll — Премиальная доставка роллов{% endblock %}</title>
    
    <!-- Подключение стилей -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="dark-theme">
    
    <!-- Шапка сайта -->
    <header class="header">
        <div class="container header-container">
            <a href="/" class="logo">
                <span class="logo-text">black<span class="accent">Roll</span></span>
            </a>
            
            <nav class="nav-menu">
                <a href="/" class="nav-link active">Каталог</a>
                <a href="#about" class="nav-link">О нас</a>
                <a href="#delivery" class="nav-link">Доставка</a>
                <a href="#contacts" class="nav-link">Контакты</a>
            </nav>
            
            <div class="header-actions">
                <button class="cart-btn" id="cartBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Модальное окно корзины -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal cart-modal">
            <div class="modal-header">
                <h2>Ваш заказ</h2>
                <button class="close-btn" id="closeCart">&times;</button>
            </div>
            <div class="modal-body" id="cartItems">
                <!-- Товары корзины будут здесь -->
                <p class="empty-cart-msg">Корзина пуста</p>
            </div>
            <div class="modal-footer">
                <div class="cart-total">
                    <span>Итого:</span>
                    <span id="cartTotalSum">0 ₽</span>
                </div>
                <button class="btn btn-primary" id="checkoutBtn">Оформить заказ</button>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 blackRoll. Премиальная доставка роллов.</p>
        </div>
    </footer>

    <!-- Скрипты -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
